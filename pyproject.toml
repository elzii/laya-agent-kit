[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"
[project]
name = "laya-agent-kit"
version = "0.2.0"
description = "Harness-portable agent tools for an existing official Laya server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "mcp>=1.2,<2"]
[project.scripts]
laya-agent-kit = "laya_agent.install:main"
laya-agent-mcp = "laya_agent.server:main"
[tool.hatch.build.targets.wheel]
packages = ["src/laya_agent"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "share/laya-agent-kit/skills"
"harnesses" = "share/laya-agent-kit/harnesses"
