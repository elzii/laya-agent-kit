[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "laya-agent-kit"
version = "0.1.0"
description = "Multi-harness coding-agent integration for an existing official Laya inference server"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Laya Agent Kit contributors" }]
dependencies = ["mcp>=1.9,<2", "httpx>=0.27,<1"]

[project.scripts]
laya-agent-kit = "laya_agent.install:main"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
"src/laya_agent/resources" = "laya_agent/resources"
